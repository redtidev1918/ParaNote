name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Skip release-please PRs (authored by github-actions[bot]): GitHub holds their
    # workflow runs for approval so they never start, which shows a permanent failed
    # check on every release PR. Self-healing: once RELEASE_PLEASE_TOKEN (a real user
    # PAT) authors the release PR, this guard no longer matches and CI returns.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]'
    name: Lint & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vitest 4 要求 Node ^20 || ^22 || >=24；发版 job 使用 Node 24（npm >= 11.5.1）
        node: [20, 22, 24]
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
